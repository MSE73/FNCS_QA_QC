[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fncsqaqc"
version = "0.1.0"
description = "FNCS MEP drawing QA/QC checker (Phase 1: drawing cleanliness + folder completeness)"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "openpyxl>=3.1",
    "click>=8.1",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fncsqaqc = "fncsqaqc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fncsqaqc"]
